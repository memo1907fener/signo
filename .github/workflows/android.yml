name: Android-App bauen

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signaturschlüssel wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "Schlüssel vorhanden."
          else
            echo "::warning::Kein KEYSTORE_BASE64 hinterlegt – APK wird NICHT signiert und lässt sich nicht installieren."
          fi

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Schlüssel löschen
        if: always()
        run: rm -f keystore.jks

      - name: APK umbenennen
        run: cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" signo.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: signo-apk
          path: android/signo.apk
          retention-days: 90
